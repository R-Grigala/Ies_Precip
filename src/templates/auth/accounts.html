{% extends "base.html" %}

{% block title %}მომხმარებლები{% endblock %}

{% block body %}
<div class="py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>მომხმარებლები</h3>
        <button class="btn btn-success" id="addUserBtn">ახალი მომხმარებლის დამატება</button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ელ.ფოსტა</th>
                    <th>როლი</th>
                    <th>მოქმედებები</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- rows populated by JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Add / Edit User Modal -->
<div class="modal fade" id="accountsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="accountsModalTitle">მომხმარებლის დამატება</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="accountsForm">
                    <input type="hidden" id="editUserUuid" />
                    <div class="mb-3">
                        <label class="form-label">ელ. ფოსტა</label>
                        <input type="email" id="userEmail" class="form-control" required />
                    </div>
                    <div class="mb-3" id="passwordGroup">
                        <label class="form-label">პაროლი</label>
                        <input type="password" id="userPassword" class="form-control" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">როლი</label>
                        <select id="userRole" class="form-select">
                            <option value="User">User</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">გაუქმება</button>
                <button type="button" class="btn btn-primary" id="saveUserBtn">შენახვა</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="{{ url_for('static', filename='js/auth/accounts.js') }}" defer></script>

{% endblock %}
